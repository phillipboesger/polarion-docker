name: PR Checks

on:
  pull_request:
    branches: [main, master, v*]

permissions:
  contents: read

jobs:
  static-checks:
    name: Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lint Dockerfile (hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error
          ignore: DL3008,DL3009,DL3015

      - name: Lint Shell Scripts (shellcheck)
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: "."
          severity: error
          additional_files: "polarion_starter.sh"
        env:
          SHELLCHECK_OPTS: --shell=bash --exclude=SC1091,SC2039

      - name: Lint YAML files (yamllint)
        run: |
          pip install --quiet yamllint
          yamllint -d "{extends: relaxed, rules: {line-length: {max: 200}}}" \
            .github/workflows/ \
            docker-compose.yml \
            docker-compose.dev.yml

      - name: Check Python syntax
        run: |
          python3 -m py_compile scripts/download_polarion_zip.py
          echo "✅ Python syntax OK"

      - name: Validate docker-compose files
        run: |
          docker compose -f docker-compose.yml config --quiet
          echo "✅ docker-compose.yml valid"
          docker compose -f docker-compose.dev.yml config --quiet
          echo "✅ docker-compose.dev.yml valid"

  timezone-tests:
    name: Timezone Auto-Detection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build isolated timezone test image
        run: |
          # Standalone image (not the full Polarion Dockerfile, no licensed ZIP needed) that
          # replicates just the tzdata/JVM layer entrypoint.d/00-configure-timezone.sh and
          # entrypoint.d/01-configure-postgres.sh depend on, so this job stays fast and runs
          # on every PR from anyone. It COPYs the real scripts from this checkout, so it always
          # tests what would actually ship, not a duplicated copy of the logic. Built from a
          # dedicated context dir, not the checkout root, so nothing needs cleaning up after.
          mkdir -p /tmp/tz-test-ctx
          cp entrypoint.d/00-configure-timezone.sh entrypoint.d/01-configure-postgres.sh /tmp/tz-test-ctx/

          # Fixed-offset, DST-free zones (Etc/GMT-N) so assertions never depend on the date
          # this job happens to run on. Also probes the JVM (jshell), not just glibc's `date`
          # — the two resolve timezone via different mechanisms (env var vs. symlink-target
          # name vs. byte-content matching) and have silently disagreed with each other in
          # every prior version of this feature; a check that only looks at `date` would have
          # missed every one of those bugs. Each value is captured twice — once inherited
          # normally, once under "env -i" — because Apache/PostgreSQL/Polarion in the real
          # image start via "service", which drops TZ from the environment entirely; a fix
          # that only works when TZ is inherited directly is not actually fixed.
          cat > /tmp/tz-test-ctx/tz-test-runner.sh <<'EOF'
          #!/bin/bash
          . /opt/tz/00-configure-timezone.sh
          echo "TZFILE=$(cat /etc/timezone 2>/dev/null || echo MISSING)"
          echo "OFFSET=$(date +%z)"
          echo "JVM_ZONE=$(echo 'System.out.println(java.util.TimeZone.getDefault().getID());' | jshell -q - 2>&1 | tail -1)"
          echo "ENVI_OFFSET=$(env -i PATH="$PATH" date +%z)"
          echo "ENVI_JVM_ZONE=$(env -i PATH="$PATH" bash -c "echo 'System.out.println(java.util.TimeZone.getDefault().getID());' | jshell -q -" 2>&1 | tail -1)"
          EOF

          cat > /tmp/tz-test-ctx/Dockerfile <<'EOF'
          FROM eclipse-temurin:21-jdk
          ENV DEBIAN_FRONTEND=noninteractive
          RUN apt-get -y update && \
            apt-get -y install --no-install-recommends tzdata postgresql && \
            apt-get clean && rm -rf /var/lib/apt/lists/* && \
            cp --remove-destination /usr/share/zoneinfo/Etc/UTC /etc/localtime && \
            rm -f /etc/timezone
          COPY 00-configure-timezone.sh /opt/tz/00-configure-timezone.sh
          COPY 01-configure-postgres.sh /opt/tz/01-configure-postgres.sh
          COPY tz-test-runner.sh /tz-test-runner.sh
          RUN sed -i 's/\r//' /opt/tz/*.sh /tz-test-runner.sh && chmod +x /tz-test-runner.sh
          EOF

          docker build -q -t tz-test:ci /tmp/tz-test-ctx
          echo "✅ Timezone test image built"

      - name: Prepare shared assertions
        run: |
          # Shared by the two TZ verification steps below (sourced, not duplicated) so the assertion logic
          # only needs fixing/extending in one place. Checks TZFILE, OFFSET and JVM_ZONE, each
          # both direct and under "env -i" — asserting only OFFSET previously let a broken
          # reverse-lookup fix (JVM falling back to bare "GMT" while glibc showed the correct
          # host time) pass every scenario silently; this suite is only worth having if it
          # actually re-fails that exact class of bug.
          cat > /tmp/assert-tz-scenario.sh <<'EOF'
          assert_tz_scenario() {
              local label="$1" expected_tzfile="$2" expected_offset="$3" expected_jvm="$4" output="$5"
              local field expected actual
              for field in TZFILE OFFSET JVM_ZONE ENVI_OFFSET ENVI_JVM_ZONE; do
                  case "$field" in
                      TZFILE) expected="$expected_tzfile" ;;
                      OFFSET|ENVI_OFFSET) expected="$expected_offset" ;;
                      JVM_ZONE|ENVI_JVM_ZONE) expected="$expected_jvm" ;;
                  esac
                  actual="$(printf '%s\n' "$output" | grep "^${field}=" | cut -d= -f2-)"
                  if [ "$actual" != "$expected" ]; then
                      echo "FAIL: $label: $field expected '$expected', got '$actual'"
                      printf '%s\n' "$output"
                      exit 1
                  fi
              done
              echo "OK: $label: TZFILE=$expected_tzfile OFFSET=$expected_offset JVM=$expected_jvm — glibc and the JVM agree, both direct and under env -i"
          }
          EOF
          echo "✅ Shared assertion helper written"

      - name: Verify auto-detect and explicit override
        run: |
          . /tmp/assert-tz-scenario.sh

          echo "🔍 No mount, no TZ -> image default Etc/UTC"
          out=$(docker run --rm tz-test:ci /tz-test-runner.sh 2>&1)
          echo "$out" | grep -q "WARNING: no host timezone available" || { echo "FAIL: expected no-mount warning not printed"; echo "$out"; exit 1; }
          if echo "$out" | grep -qi "detected\|host timezone Etc"; then echo "FAIL: log claims a detected zone without a mount"; echo "$out"; exit 1; fi
          assert_tz_scenario "no mount / no TZ" "Etc/UTC" "+0000" "UTC" "$out"

          echo "🔍 Host timezone mounted (Etc/GMT-5), no TZ -> auto-detected"
          out=$(docker run --rm -v /usr/share/zoneinfo/Etc/GMT-5:/etc/host-localtime:ro tz-test:ci /tz-test-runner.sh 2>&1)
          if echo "$out" | grep -q "WARNING: no host timezone available"; then echo "FAIL: no-mount warning printed although the host zone was mounted"; echo "$out"; exit 1; fi
          echo "$out" | grep -q "Using host timezone Etc/GMT-5" || { echo "FAIL: detected zone not logged"; echo "$out"; exit 1; }
          assert_tz_scenario "auto-detect" "Etc/GMT-5" "+0500" "Etc/GMT-5" "$out"

          echo "🔍 Host mounted (Etc/GMT-5) + explicit TZ=Etc/GMT-8 -> override wins"
          out=$(docker run --rm -v /usr/share/zoneinfo/Etc/GMT-5:/etc/host-localtime:ro -e TZ=Etc/GMT-8 tz-test:ci /tz-test-runner.sh)
          assert_tz_scenario "explicit override" "Etc/GMT-8" "+0800" "Etc/GMT-8" "$out"

      - name: Verify malformed/hostile TZ input can't crash or leak through
        run: |
          . /tmp/assert-tz-scenario.sh

          echo "🔍 Unknown TZ name -> warns, falls back to detected zone, doesn't leak into children"
          out=$(docker run --rm -v /usr/share/zoneinfo/Etc/GMT-5:/etc/host-localtime:ro -e TZ=Bogus/Zone tz-test:ci /tz-test-runner.sh 2>&1)
          echo "$out" | grep -q "WARNING: TZ='Bogus/Zone' is not a valid timezone" || { echo "FAIL: expected warning not printed"; echo "$out"; exit 1; }
          assert_tz_scenario "unknown TZ" "Etc/GMT-5" "+0500" "Etc/GMT-5" "$out"

          echo "🔍 TZ pointing at non-zone zoneinfo metadata (zone.tab) -> rejected, not silently accepted"
          out=$(docker run --rm -e TZ=zone.tab tz-test:ci /tz-test-runner.sh)
          assert_tz_scenario "non-zone TZ" "Etc/UTC" "+0000" "UTC" "$out"

          echo "🔍 Path-traversal-shaped TZ -> rejected"
          out=$(docker run --rm -e "TZ=../../etc/hostname" tz-test:ci /tz-test-runner.sh)
          assert_tz_scenario "path traversal TZ" "Etc/UTC" "+0000" "UTC" "$out"

          echo "🔍 Host timezone data with no byte-identical match anywhere in this image's tzdata -> uniform Etc/UTC fallback, not a glibc/JVM split"
          head -c 200 /dev/urandom > /tmp/random-localtime
          out=$(docker run --rm -v /tmp/random-localtime:/etc/host-localtime:ro tz-test:ci /tz-test-runner.sh 2>&1)
          echo "$out" | grep -q "WARNING: the host's timezone data has no byte-identical match" || { echo "FAIL: expected warning not printed"; echo "$out"; exit 1; }
          assert_tz_scenario "unmatched host tzdata" "Etc/UTC" "+0000" "UTC" "$out"

          echo "🔍 Bind-mounted straight onto /etc/localtime (wrong target) -> warns instead of silently claiming success"
          out=$(docker run --rm -v /usr/share/zoneinfo/Etc/GMT-5:/etc/localtime:ro tz-test:ci /tz-test-runner.sh 2>&1)
          echo "$out" | grep -q "WARNING: /etc/localtime is not writable" || { echo "FAIL: expected warning not printed"; echo "$out"; exit 1; }
          # /etc/timezone stays unwritten (apply_zone must not report success), while
          # /etc/localtime itself keeps showing what the host actually mounted there.
          assert_tz_scenario "wrong mount target" "MISSING" "+0500" "Etc/GMT-5" "$out"

      - name: Verify polarion_detect_host_timezone's fallback chain
        run: |
          # scripts/polarion-runtime-lib.sh runs on the HOST (not in the container being
          # started), so it can't rely on a bind mount — it reads the host's timezone
          # directly instead, and this is the only detection path scripts/polarionctl.sh
          # actually uses (it forwards the result as -e TZ=..., never bind-mounts
          # /etc/host-localtime). Exercised in a disposable container per scenario so each
          # can freely manipulate /etc/localtime, /etc/timezone, and stub out "timedatectl"
          # without touching this job's own runner.
          assert_detected_tz() {
              local label="$1" expected="$2" actual="$3"
              if [ "$actual" != "$expected" ]; then
                  echo "FAIL: $label: expected POLARION_TZ='$expected', got '$actual'"
                  exit 1
              fi
              echo "OK: $label -> POLARION_TZ='$expected'"
          }
          run_detect() {
              docker run --rm -v "$(pwd)/scripts/polarion-runtime-lib.sh:/opt/lib/polarion-runtime-lib.sh:ro" \
                ubuntu:24.04 bash -c "$1"
          }

          echo "🔍 /etc/localtime is a symlink into zoneinfo/ -> detected from its target"
          result=$(run_detect '
            apt-get -y update >/dev/null 2>&1 && DEBIAN_FRONTEND=noninteractive apt-get -y install --no-install-recommends tzdata >/dev/null 2>&1
            ln -snf /usr/share/zoneinfo/Europe/Berlin /etc/localtime
            source /opt/lib/polarion-runtime-lib.sh
            echo "$POLARION_TZ"
          ')
          assert_detected_tz "symlink" "Europe/Berlin" "$result"

          echo "🔍 /etc/localtime is not a symlink, but timedatectl reports a zone -> detected from timedatectl"
          result=$(run_detect '
            rm -f /etc/localtime
            printf "#!/bin/bash\necho Asia/Tokyo\n" > /usr/local/bin/timedatectl
            chmod +x /usr/local/bin/timedatectl
            source /opt/lib/polarion-runtime-lib.sh
            echo "$POLARION_TZ"
          ')
          assert_detected_tz "timedatectl fallback" "Asia/Tokyo" "$result"

          echo "🔍 Neither a symlink nor timedatectl, but /etc/timezone has content -> detected from that file"
          result=$(run_detect '
            rm -f /etc/localtime
            echo "America/Sao_Paulo" > /etc/timezone
            source /opt/lib/polarion-runtime-lib.sh
            echo "$POLARION_TZ"
          ')
          assert_detected_tz "/etc/timezone fallback" "America/Sao_Paulo" "$result"

          echo "🔍 None of the three available -> empty (caller falls back to the image default, NOTE printed)"
          result=$(run_detect '
            rm -f /etc/localtime /etc/timezone
            source /opt/lib/polarion-runtime-lib.sh
            echo "[$POLARION_TZ]"
          ' 2>&1)
          echo "$result" | grep -q "NOTE: could not detect this host's timezone" && { echo "FAIL: the NOTE must only print inside polarionctl.sh's start) case, not from the library itself"; exit 1; }
          assert_detected_tz "nothing detectable" "[]" "$(echo "$result" | tail -1)"

          echo "🔍 POLARION_TZ already set -> detection skipped, explicit value wins"
          result=$(run_detect '
            apt-get -y update >/dev/null 2>&1 && DEBIAN_FRONTEND=noninteractive apt-get -y install --no-install-recommends tzdata >/dev/null 2>&1
            ln -snf /usr/share/zoneinfo/Europe/Berlin /etc/localtime
            export POLARION_TZ=Custom/Zone
            source /opt/lib/polarion-runtime-lib.sh
            echo "$POLARION_TZ"
          ')
          assert_detected_tz "explicit POLARION_TZ wins" "Custom/Zone" "$result"

      - name: Verify PostgreSQL timezone config stays in sync, including on revert
        run: |
          # Written to a file and mounted in rather than passed via "docker run ... bash -c"
          # so the script's own single/double quoting (postgresql.conf's "timezone = 'X'"
          # syntax) never has to fight the outer shell's quoting.
          cat > /tmp/pg-tz-test.sh <<'EOF'
          #!/bin/bash
          set -e
          if ! su postgres -c "/usr/lib/postgresql/*/bin/initdb -D /tmp/pgdata" >/tmp/initdb.log 2>&1; then
              echo "FAIL: initdb failed:"
              cat /tmp/initdb.log
              exit 1
          fi
          mkdir -p /opt/polarion/data
          ln -s /tmp/pgdata /opt/polarion/data/postgres-data
          PG_CONF=/tmp/pgdata/postgresql.conf

          apply_pg_tz() {
              echo "$1" > /etc/timezone
              . /opt/tz/01-configure-postgres.sh >/dev/null 2>&1 || true
          }

          # A -> B -> B -> C -> B -> B: the repeat and the revert-to-a-prior-zone are both
          # deliberate. An earlier version of this fix used an unanchored substring match to
          # decide whether a rewrite was needed, which also matched its own commented-out
          # line — so reverting to zone B after C silently kept Postgres on C.
          for z in Etc/UTC Etc/GMT-5 Etc/GMT-5 Etc/GMT-8 Etc/GMT-5 Etc/GMT-5; do
              apply_pg_tz "$z"
              active="$(grep -E "^timezone = '${z}'" "$PG_CONF" || true)"
              if [ -z "$active" ]; then
                  echo "FAIL: after setting $z, postgresql.conf timezone is not active:"
                  grep -E "^timezone|^#timezone" "$PG_CONF"
                  exit 1
              fi
              tz_count=$(grep -cE "^timezone = " "$PG_CONF")
              logtz_count=$(grep -cE "^log_timezone = " "$PG_CONF")
              if [ "$tz_count" != "1" ] || [ "$logtz_count" != "1" ]; then
                  echo "FAIL: after setting $z, expected exactly 1 active timezone/log_timezone line, got $tz_count/$logtz_count (config growing unbounded on restart)"
                  exit 1
              fi
          done
          echo "OK: PostgreSQL timezone/log_timezone track every change, including reverting to a prior zone, without growing unbounded"

          # initdb ships this commented out, so the earlier version of this check (asserting
          # it's still commented) could never fail regardless of correctness. Uncomment it
          # first, then apply a zone the loop above didn't just leave active (Etc/GMT-3,
          # never used yet) so the idempotency guard can't skip the rewrite and hide a
          # regression — to prove the timezone sed pattern, anchored on "=" since round 4,
          # leaves an unrelated, already-active setting alone instead of also matching and
          # re-commenting it.
          sed -i "s/^#timezone_abbreviations/timezone_abbreviations/" "$PG_CONF"
          apply_pg_tz "Etc/GMT-3"
          if ! grep -q "^timezone_abbreviations" "$PG_CONF"; then
              echo "FAIL: timezone_abbreviations was commented out — the timezone sed pattern is matching more than intended"
              exit 1
          fi
          echo "OK: timezone_abbreviations left untouched by the timezone sed pattern"
          EOF

          docker run --rm -v /tmp/pg-tz-test.sh:/pg-tz-test.sh:ro tz-test:ci bash /pg-tz-test.sh

      - name: Verify listen_addresses config stays in sync, without growing unbounded
        run: |
          # Same script as the timezone step above (01-configure-postgres.sh configures both
          # listen_addresses and timezone/log_timezone in one pass), same tz-test:ci image,
          # same real initdb-created postgresql.conf — just asserting the OTHER guard in that
          # file. Regression test for #83: the original code unconditionally commented out the
          # previous listen_addresses line and appended a fresh one on every container start,
          # so postgresql.conf grew by two lines per restart forever.
          cat > /tmp/pg-listen-test.sh <<'EOF'
          #!/bin/bash
          set -e
          if ! su postgres -c "/usr/lib/postgresql/*/bin/initdb -D /tmp/pgdata" >/tmp/initdb.log 2>&1; then
              echo "FAIL: initdb failed:"
              cat /tmp/initdb.log
              exit 1
          fi
          mkdir -p /opt/polarion/data
          ln -s /tmp/pgdata /opt/polarion/data/postgres-data
          PG_CONF=/tmp/pgdata/postgresql.conf

          # NOTE: a live-line-count assertion alone is not enough here — the ORIGINAL bug
          # comments out the previously-appended active line before appending a new one, so
          # exactly 1 active line is true on every single run even though the file grows by
          # one commented-out line every time. The real regression signal is the TOTAL count
          # (live + commented-out) and the file's line count staying flat from the second run
          # onward, once the guard has had one run to settle.
          . /opt/tz/01-configure-postgres.sh >/dev/null 2>&1 || true
          live_count=$(grep -cxF "listen_addresses = '*'" "$PG_CONF" || true)
          if [ "$live_count" != "1" ]; then
              echo "FAIL: after the first start, expected exactly 1 active listen_addresses line, got $live_count"
              grep -E "^listen_addresses|^#listen_addresses" "$PG_CONF" || true
              exit 1
          fi
          base_total=$(grep -c "listen_addresses" "$PG_CONF" || true)
          base_lines=$(wc -l < "$PG_CONF")

          for i in 2 3 4 5; do
              . /opt/tz/01-configure-postgres.sh >/dev/null 2>&1 || true
              live_count=$(grep -cxF "listen_addresses = '*'" "$PG_CONF" || true)
              total_count=$(grep -c "listen_addresses" "$PG_CONF" || true)
              total_lines=$(wc -l < "$PG_CONF")
              if [ "$live_count" != "1" ] || [ "$total_count" != "$base_total" ] || [ "$total_lines" != "$base_lines" ]; then
                  echo "FAIL: after start #$i, expected 1 active line and $base_total total listen_addresses line(s) in a $base_lines-line file, got $live_count active / $total_count total in a $total_lines-line file (config growing unbounded on restart)"
                  grep -nE "listen_addresses" "$PG_CONF" || true
                  exit 1
              fi
          done
          echo "OK: listen_addresses stays at exactly 1 active line across 5 restarts, and the total listen_addresses line count ($base_total) and file size ($base_lines lines) never grow after the first start"
          EOF

          docker run --rm -v /tmp/pg-listen-test.sh:/pg-listen-test.sh:ro tz-test:ci bash /pg-listen-test.sh

  shutdown-tests:
    name: Graceful Shutdown & Startup Reporting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build isolated shutdown test image
        run: |
          # No licensed Polarion ZIP needed: `service` and `pg_ctl` are stubbed as fake
          # executables that log their own invocation to a file, so this exercises the REAL
          # polarion_starter.sh (COPYed from this checkout) against a fake environment instead
          # of duplicating its logic. Regression coverage for #80 (SIGTERM/INT now stop
          # Polarion/Apache/PostgreSQL in order instead of the container being SIGKILLed once
          # Docker's stop grace period runs out) and #87 (a failed entrypoint.d script is
          # reported in the final startup message instead of being silently swallowed).
          mkdir -p /tmp/shutdown-test-ctx/entrypoint.d
          cp polarion_starter.sh /tmp/shutdown-test-ctx/

          cat > /tmp/shutdown-test-ctx/entrypoint.d/01-fail.sh <<'EOF'
          #!/bin/bash
          echo "simulating a failed entrypoint step"
          return 1
          EOF

          cat > /tmp/shutdown-test-ctx/service <<'EOF'
          #!/bin/bash
          echo "STUB service $*" >> /tmp/shutdown-log
          exit 0
          EOF

          cat > /tmp/shutdown-test-ctx/pg_ctl <<'EOF'
          #!/bin/bash
          echo "STUB pg_ctl $*" >> /tmp/shutdown-log
          exit 0
          EOF

          cat > /tmp/shutdown-test-ctx/Dockerfile <<'EOF'
          FROM ubuntu:24.04
          # Only "sudo" plus a bare "postgres" system account are needed here — the real
          # PostgreSQL package isn't, since pg_ctl itself is stubbed out below.
          RUN apt-get -y update && \
            apt-get -y install --no-install-recommends sudo && \
            apt-get clean && rm -rf /var/lib/apt/lists/* && \
            useradd --system --no-create-home postgres
          RUN mkdir -p /opt/polarion/entrypoint.d /opt/polarion/data/postgres-data /usr/lib/postgresql/current/bin
          COPY entrypoint.d/01-fail.sh /opt/polarion/entrypoint.d/01-fail.sh
          COPY polarion_starter.sh /polarion_root/polarion_starter.sh
          COPY service /usr/local/bin/service
          COPY pg_ctl /usr/lib/postgresql/current/bin/pg_ctl
          RUN chmod +x /opt/polarion/entrypoint.d/01-fail.sh /polarion_root/polarion_starter.sh \
            /usr/local/bin/service /usr/lib/postgresql/current/bin/pg_ctl
          # Pre-created world-writable, at build time: whichever stub writes to it FIRST at
          # runtime (root via the "service" stub, or the "postgres" user via "sudo -u postgres"
          # in the pg_ctl stub) must not end up implicitly owning it at a mode the other can't
          # append to.
          RUN touch /tmp/shutdown-log && chmod 666 /tmp/shutdown-log
          WORKDIR /polarion_root
          EOF

          docker build -q -t shutdown-test:ci /tmp/shutdown-test-ctx
          echo "✅ Shutdown test image built"

      - name: Verify SIGTERM stops services in order and the startup message reflects failures
        run: |
          # Log file lives inside the container's own filesystem, retrieved via "docker cp"
          # after stop instead of a host bind-mount: a bind-mounted log hit permission-denied
          # writes from inside the container on hosted runners even after chmod 666 on the host
          # side, which a plain in-container file + "docker cp" sidesteps entirely.
          docker rm -f shutdown-test >/dev/null 2>&1 || true
          docker run -d --name shutdown-test shutdown-test:ci ./polarion_starter.sh >/dev/null
          sleep 3

          start_ts=$(date +%s)
          docker stop -t 30 shutdown-test >/dev/null
          end_ts=$(date +%s)
          elapsed=$((end_ts - start_ts))

          out="$(docker logs shutdown-test 2>&1)"
          docker cp shutdown-test:/tmp/shutdown-log /tmp/shutdown-log 2>/dev/null || : > /tmp/shutdown-log
          docker rm shutdown-test >/dev/null

          echo "--- container output ---"
          echo "$out"
          echo "--- shutdown-log ---"
          cat /tmp/shutdown-log

          if [ "$elapsed" -ge 25 ]; then
            echo "FAIL: docker stop took ${elapsed}s (30s timeout) — the SIGTERM trap did not fire promptly, the container was likely SIGKILLed after the grace period instead of shutting down cleanly"
            exit 1
          fi
          echo "OK: docker stop returned in ${elapsed}s, well inside the 30s grace period — no SIGKILL fallback needed"

          grep -q "STUB service polarion stop" /tmp/shutdown-log || { echo "FAIL: 'service polarion stop' was not called"; exit 1; }
          grep -q "STUB service apache2 stop" /tmp/shutdown-log || { echo "FAIL: 'service apache2 stop' was not called"; exit 1; }
          grep -q "STUB pg_ctl.*-m fast stop" /tmp/shutdown-log || { echo "FAIL: 'pg_ctl -m fast stop' was not called"; exit 1; }

          # Presence alone doesn't prove ORDER — assert the actual sequence in the log.
          actual_order="$(grep -E 'STUB (service|pg_ctl)' /tmp/shutdown-log | sed -E 's/^STUB (service polarion|service apache2|pg_ctl) .*/\1/')"
          expected_order="$(printf 'service polarion\nservice apache2\npg_ctl')"
          if [ "$actual_order" != "$expected_order" ]; then
            echo "FAIL: services were not stopped in the expected order (polarion, then apache2, then postgres). Got:"
            echo "$actual_order"
            exit 1
          fi
          echo "OK: polarion, apache2 and postgres were stopped in that exact order on SIGTERM"

          echo "$out" | grep -q "!!! FAILED (1): /opt/polarion/entrypoint.d/01-fail.sh" || { echo "FAIL: the simulated entrypoint failure was not reported"; exit 1; }
          echo "$out" | grep -q "step(s) failed" || { echo "FAIL: the final startup message doesn't reflect the failed step"; exit 1; }
          echo "OK: a failed entrypoint.d script is reported in the startup log instead of being silently ignored"

  copilot-tests:
    name: Copilot & SALT Configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build isolated Copilot config test image
        run: |
          # No licensed Polarion ZIP needed: sources the REAL 04-configure-properties.sh and
          # 06-configure-copilot.sh against a throwaway SVN repository, a license "users"
          # fixture and a minimal polarion.properties.
          mkdir -p /tmp/copilot-test-ctx/entrypoint.d
          cp entrypoint.d/04-configure-properties.sh entrypoint.d/06-configure-copilot.sh /tmp/copilot-test-ctx/entrypoint.d/

          cat > /tmp/copilot-test-ctx/run-tests.sh <<'EOF'
          #!/bin/bash
          # Runs inside the copilot-config-test image. Sources the REAL entrypoint scripts against fixtures.
          fail() { echo "FAIL: $*"; exit 1; }
          ok() { echo "OK: $*"; }
          PROPS=/opt/polarion/etc/polarion.properties
          USERS=/opt/polarion/polarion/license/users
          REPO=/opt/polarion/data/svn/repo
          props_reset() { printf 'com.siemens.polarion.license.salt.enabled=false\n# End property file\n' > "$PROPS"; }
          users_reset() { printf '# header\nconcurrentALMUser1=admin\nconcurrentCopilotUser1=old\n' > "$USERS"; }
          run04() { ( MAILPIT_EMBEDDED=false; export MAILPIT_EMBEDDED; . /opt/polarion/entrypoint.d/04-configure-properties.sh >/dev/null ); }
          run06() { ( . /opt/polarion/entrypoint.d/06-configure-copilot.sh ); }
          ctx() { svnlook cat "$REPO" .polarion/context.properties 2>/dev/null; }

          # --- 04: SALT + Copilot switch -------------------------------------------------------------
          # Fixture starts at salt.enabled=true so the check can't pass if 04 never ran.
          printf 'com.siemens.polarion.license.salt.enabled=true\n# End property file\n' > "$PROPS"
          ( unset SALT_LICENSE_SERVER POLARION_COPILOT_ENABLED; run04 ) || fail "04-configure-properties.sh failed"
          grep -qx 'com.siemens.polarion.license.salt.enabled=false' "$PROPS" || fail "SALT must stay disabled by default"
          grep -q 'salt.server' "$PROPS" && fail "no SALT server expected by default"
          ok "SALT disabled by default"

          props_reset; ( export SALT_LICENSE_SERVER=29000@salt.example.com POLARION_COPILOT_ENABLED=true; run04 )
          grep -qx 'com.siemens.polarion.license.salt.enabled=true' "$PROPS" || fail "SALT not enabled"
          grep -qx 'com.siemens.polarion.license.salt.server=29000@salt.example.com' "$PROPS" || fail "SALT server not written"
          grep -qx 'com.siemens.polarion.copilot.enabled=true' "$PROPS" || fail "Copilot not enabled"
          [ "$(grep -c '^com.siemens.polarion.license.salt.enabled=' "$PROPS")" = 1 ] || fail "duplicate salt.enabled lines"
          ok "SALT server + Copilot switch"

          ( export SALT_LICENSE_SERVER= POLARION_COPILOT_ENABLED=false; run04 )
          grep -qx 'com.siemens.polarion.license.salt.enabled=false' "$PROPS" || fail "empty SALT_LICENSE_SERVER must disable SALT"
          grep -qx 'com.siemens.polarion.copilot.enabled=false' "$PROPS" || fail "Copilot not switched off"
          ok "empty server disables SALT, Copilot switched off"

          # --- 06: Copilot seats ----------------------------------------------------------------------
          users_reset; ( export POLARION_COPILOT_USERS=' admin, jdoe@corp.example ,bad;id,' ; run06 ) || true
          grep -qx 'concurrentCopilotUser1=admin' "$USERS" || fail "admin seat missing"
          grep -qx 'concurrentCopilotUser2=jdoe@corp.example' "$USERS" || fail "second seat missing"
          grep -q 'old' "$USERS" && fail "stale Copilot seat not removed"
          grep -q 'bad' "$USERS" && fail "invalid user ID was written"
          grep -qx 'concurrentALMUser1=admin' "$USERS" || fail "unrelated license lines must stay"
          ok "concurrent seats replace old ones, invalid IDs rejected"

          users_reset; ( export POLARION_COPILOT_USERS=admin POLARION_COPILOT_LICENSE=named; run06 )
          grep -qx 'namedCopilotUser1=admin' "$USERS" || fail "named seat missing"
          grep -q '^concurrentCopilotUser' "$USERS" && fail "concurrent seat left over"
          ok "named seat type"

          users_reset; ( export POLARION_COPILOT_USERS=admin POLARION_COPILOT_LICENSE=floating; run06 ) && fail "invalid license type must fail"
          grep -qx 'concurrentCopilotUser1=old' "$USERS" || fail "invalid license type must leave the file untouched"
          ok "invalid license type rejected without changes"

          users_reset; ( unset POLARION_COPILOT_USERS; run06 )
          grep -qx 'concurrentCopilotUser1=old' "$USERS" || fail "unset POLARION_COPILOT_USERS must not touch the file"
          ok "unset users variable is a no-op"

          users_reset; ( export POLARION_COPILOT_USERS=' ,bad;id,'; run06 ) && fail "no valid user ID must fail"
          grep -qx 'concurrentCopilotUser1=old' "$USERS" || fail "no valid user ID must leave existing seats untouched"
          ok "no valid user ID leaves seats unchanged"

          printf 'concurrentALMUser1=admin' > "$USERS"; ( export POLARION_COPILOT_USERS=$'a\nb'; run06 )
          grep -qx 'concurrentALMUser1=admin' "$USERS" || fail "last line without newline was corrupted"
          grep -qx 'concurrentCopilotUser1=a' "$USERS" || fail "seat after unterminated line missing"
          grep -qx 'concurrentCopilotUser2=b' "$USERS" || fail "newline-separated user ignored"
          ok "unterminated last line kept, newline-separated users accepted"

          # --- 06: runtime properties seeding ---------------------------------------------------------
          rev0="$(svnlook youngest "$REPO")"
          ( export POLARION_RUNTIME_PROPERTIES=$'copilot.model.gpt.provider=openai\ncopilot.model.gpt.model=gpt-4.1;copilot.default.model=gpt\n# comment\nbroken line\n'; run06 ) || true
          [ "$(svnlook youngest "$REPO")" = $((rev0 + 1)) ] || fail "expected exactly one commit"
          ctx | grep -qx 'copilot.model.gpt.provider=openai' || fail "provider not seeded"
          ctx | grep -qx 'copilot.default.model=gpt' || fail "';' separated entry not seeded"
          ctx | grep -q 'broken' && fail "malformed entry was written"
          [ "$(svnlook author "$REPO")" = polarion ] || fail "commit author should be polarion"
          ok "seeded into fresh /.polarion/context.properties"

          ( export POLARION_RUNTIME_PROPERTIES=$'copilot.model.gpt.model=gpt-5\nscriptInjection.mainHead=<script src="/x.js"></script>'; run06 )
          ctx | grep -qx 'copilot.model.gpt.model=gpt-4.1' || fail "existing key must not be overwritten"
          ctx | grep -qx 'scriptInjection.mainHead=<script src="/x.js"></script>' || fail "new key with '=' in value not appended"
          ctx | grep -qx 'copilot.model.gpt.provider=openai' || fail "existing content lost"
          ok "existing keys kept, new keys appended"

          rev1="$(svnlook youngest "$REPO")"
          ( export POLARION_RUNTIME_PROPERTIES='copilot.default.model=other'; run06 )
          [ "$(svnlook youngest "$REPO")" = "$rev1" ] || fail "no-op run must not commit"
          ok "idempotent: nothing to seed, no commit"

          ( export POLARION_RUNTIME_PROPERTIES='copilot.default.model=x' POLARION_SVN_REPO=/nonexistent; run06 ) && fail "missing repository must fail"
          ok "missing repository reported"
          echo "ALL COPILOT CONFIG TESTS PASSED"
          EOF

          cat > /tmp/copilot-test-ctx/Dockerfile <<'EOF'
          FROM ubuntu:24.04
          RUN apt-get -y update && \
            apt-get -y install --no-install-recommends subversion && \
            apt-get clean && rm -rf /var/lib/apt/lists/*
          RUN mkdir -p /opt/polarion/entrypoint.d /opt/polarion/etc /opt/polarion/polarion/license /opt/polarion/data/svn && \
            svnadmin create /opt/polarion/data/svn/repo
          COPY entrypoint.d/ /opt/polarion/entrypoint.d/
          COPY run-tests.sh /run-tests.sh
          EOF

          docker build -q -t copilot-test:ci /tmp/copilot-test-ctx
          echo "✅ Copilot config test image built"

      - name: Verify SALT switch, Copilot seats and runtime property seeding
        run: docker run --rm copilot-test:ci bash /run-tests.sh

  drift-check-tests:
    name: Version Branch Drift Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify scripts/check-version-branch-drift.sh against a fixture repository
        run: |
          # Throwaway repo with a main and a v9999 branch and backdated commits, so drift ages
          # are deterministic: overrides (whole file / regex), the grace period, oldest-unsynced
          # age, branch-only files and bad input. No network, no real version branches touched.
          set -euo pipefail
          SCRIPT="$PWD/scripts/check-version-branch-drift.sh"
          repo="$(mktemp -d)"
          out="$(mktemp)"
          cd "$repo"
          git init -q -b main .
          git config user.email ci@example.invalid
          git config user.name ci
          # The fixture is its own "origin", so the script sees refs/remotes/origin/{main,v9999}.
          git remote add origin "$repo"
          ago() { date -u -d "-$1 days" +%Y-%m-%dT%H:%M:%SZ; }
          commit() { GIT_AUTHOR_DATE="$(ago "$1")" GIT_COMMITTER_DATE="$(ago "$1")" git commit -q -m "$2"; }
          on() { git checkout -q "$1"; }
          # check <expected exit> [grace days]: runs the script, prints its output on mismatch.
          check() {
              local want="$1" rc=0
              git fetch -q origin
              bash "$SCRIPT" "${2:-14}" > "$out" 2>&1 || rc=$?
              if [ "$rc" -ne "$want" ]; then
                  cat "$out"
                  echo "FAIL: expected exit ${want}, got ${rc}"
                  exit 1
              fi
          }
          expect() { grep -qF -- "$1" "$out" || { cat "$out"; echo "FAIL: output lacks '$1'"; exit 1; }; }
          reject() { if grep -qF -- "$1" "$out"; then cat "$out"; echo "FAIL: output has '$1'"; exit 1; fi; }

          mkdir -p .github
          printf 'FROM base:1\nARG JDK_MAJOR_VERSION=21\n' > Dockerfile
          echo one > shared.txt
          git add . && commit 60 base
          git branch v9999
          on v9999
          sed -i 's/JDK_MAJOR_VERSION=21/JDK_MAJOR_VERSION=17/' Dockerfile
          printf '# comment\nDockerfile ^ARG JDK_MAJOR_VERSION=\n' > .github/version-branch-overrides
          git add . && commit 59 "branch: JDK 17"

          echo "-- only the overridden line differs: in sync --"
          check 0
          expect "v9999: in sync with main"

          echo "-- main change older than the grace period: fails --"
          on main
          echo new > new.sh && git add . && commit 30 "main: new.sh"
          check 1
          expect "::error file=new.sh::v9999 is missing main's changes to new.sh (unsynced for 30 days)"

          echo "-- synced again: passes --"
          on v9999
          git checkout -q main -- new.sh && commit 29 "branch: sync new.sh"
          check 0

          echo "-- non-overridden line of an overridden file: still drift --"
          on main
          sed -i 's/base:1/base:2/' Dockerfile && git add . && commit 20 "main: new base"
          check 1
          expect "::error file=Dockerfile::"
          on v9999
          sed -i 's/base:1/base:2/' Dockerfile && git add . && commit 19 "branch: sync base"
          check 0

          echo "-- fresh main change: warning only, fails once older than grace --"
          on main
          echo two > shared.txt && git add . && commit 2 "main: shared"
          check 0
          expect "::warning file=shared.txt::v9999 is missing main's changes to shared.txt (unsynced for 2 days)"
          expect "OK: no drift older than 14 days (1 within grace)"
          check 1 1
          expect "::error file=shared.txt::"

          echo "-- age counts from the OLDEST unsynced main commit --"
          echo three > shared.txt && git add . && commit 1 "main: shared again"
          check 1 1
          expect "(unsynced for 2 days)"

          echo "-- branch-only file not in the overrides: stale --"
          on v9999
          echo mine > branch-only.txt && git add . && commit 1 "branch: own file"
          check 1
          expect "::error file=branch-only.txt::branch-only.txt exists only on v9999; list it in .github/version-branch-overrides or remove it"

          echo "-- whole-file overrides allow it --"
          printf 'branch-only.txt\nshared.txt\n' >> .github/version-branch-overrides
          git add . && commit 1 "branch: overrides"
          check 0
          reject "branch-only.txt"
          reject "shared.txt"
          expect "v9999: in sync with main"

          echo "-- invalid grace value is rejected --"
          check 2 abc

          echo "✅ version-branch drift check behaves as expected"

  volume-tests:
    name: Volumes & SVN Credentials
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify volume selection, the SVN version marker and SVN credential handling
        run: |
          # polarionctl.sh runs against a mocked docker CLI (never a real start); 04-bootstrap-svn.sh
          # and 05-configure-apache.sh are sourced against scratch dirs and fake Polarion Apache
          # configs (file auth = 2410/2506, DB auth = 2512+).
          cat > /tmp/volume-test.sh <<'SCRIPT'
          set -euo pipefail
          LIB="$PWD/scripts/polarion-runtime-lib.sh"
          CTL="$PWD/scripts/polarionctl.sh"

          echo "-- volume names: shared default, explicit override wins --"
          volumes_for() {
              env -i PATH=/usr/bin:/bin HOME=/tmp POLARION_TZ=UTC POLARION_IMAGE="$1" ${2:+POLARION_DATA_VOLUME="$2"} ${3:+POLARION_EXTENSIONS_VOLUME="$3"} \
                  bash -c "source '$LIB'; echo \"\$POLARION_DATA_VOLUME \$POLARION_EXTENSIONS_VOLUME\""
          }
          expect_volumes() {
              local got
              got="$(volumes_for "$1" "${3:-}" "${4:-}")"
              [ "$got" = "$2" ] || { echo "FAIL: image '$1': expected '$2', got '$got'"; exit 1; }
              echo "OK: $1 ${3:+(explicit $3 ${4:-}) }-> $got"
          }
          expect_volumes "ghcr.io/phillipboesger/polarion-docker:v2506" "polarion_repo polarion_extensions"
          expect_volumes "ghcr.io/phillipboesger/polarion-docker:v2606" "polarion_repo polarion_extensions"
          expect_volumes "polarion:local" "polarion_repo polarion_extensions"
          expect_volumes "ghcr.io/phillipboesger/polarion-docker:v2606" "polarion_repo_v2506 polarion_extensions_v2506" "polarion_repo_v2506" "polarion_extensions_v2506"
          expect_volumes "polarion:v2606" "my_repo polarion_extensions" "my_repo"

          echo "-- polarionctl start passes the selected volumes (mocked docker CLI) --"
          mock="$(mktemp -d)"
          cat > "$mock/docker" <<'EOF'
          #!/bin/bash
          echo "docker $*" >> "$MOCK_LOG"
          case "$1 ${2:-}" in
              "volume inspect") grep -qxF "$3" "$MOCK_VOLUMES" ;;
              "volume create") echo "$3" >> "$MOCK_VOLUMES" ;;
              "run -d") echo mock-container-id ;;
              *) exit 1 ;;
          esac
          EOF
          chmod +x "$mock/docker"
          start() {
              : > "$mock/log"; : > "$mock/volumes"
              env PATH="$mock:/usr/bin:/bin" MOCK_LOG="$mock/log" MOCK_VOLUMES="$mock/volumes" POLARION_TZ=UTC \
                  POLARION_RUNTIME=docker POLARION_IMAGE=ghcr.io/phillipboesger/polarion-docker:v2506 \
                  POLARION_START_TIMEOUT=1 POLARION_START_POLL_INTERVAL=1 "$@" \
                  bash "$CTL" start > "$mock/out" 2>&1 || true
          }
          start
          grep -q -- "-v polarion_repo:/opt/polarion/data/svn" "$mock/log" && grep -q -- "-v polarion_extensions:/opt/polarion/polarion/extensions" "$mock/log" \
              || { cat "$mock/log"; echo "FAIL: default volumes not passed"; exit 1; }
          echo "OK: default start -> polarion_repo / polarion_extensions"
          start POLARION_DATA_VOLUME=repo_a POLARION_EXTENSIONS_VOLUME=ext_a
          grep -q -- "-v repo_a:/opt/polarion/data/svn" "$mock/log" && grep -q -- "-v ext_a:/opt/polarion/polarion/extensions" "$mock/log" \
              || { cat "$mock/log"; echo "FAIL: explicit volumes ignored"; exit 1; }
          start POLARION_DATA_VOLUME=repo_b
          grep -q -- "-v repo_b:/opt/polarion/data/svn" "$mock/log" || { cat "$mock/log"; echo "FAIL: second explicit volume ignored"; exit 1; }
          echo "OK: explicit POLARION_DATA_VOLUME / POLARION_EXTENSIONS_VOLUME win and can differ per start"

          echo "-- entrypoint records the Polarion version and warns on a foreign volume --"
          command -v htpasswd >/dev/null || { apt-get -qq update >/dev/null && DEBIAN_FRONTEND=noninteractive apt-get -qq install -y apache2-utils >/dev/null 2>&1; }
          id polarion >/dev/null 2>&1 || useradd -M polarion
          boot() {
              # boot <svn dir> <platform plugin version>: one container start's 04-bootstrap-svn.sh
              local plugins
              plugins="$(mktemp -d)"
              mkdir -p "$plugins/com.polarion.platform_$2"
              SVN_DATA_DIR="$1" SVN_BOOTSTRAP_DIR=/nonexistent POLARION_PLUGINS_DIR="$plugins" \
                  bash -c 'source "$0"' "$PWD/entrypoint.d/04-bootstrap-svn.sh" > "$1.out" 2>&1
          }
          svn_dir="$(mktemp -d)/svn"
          boot "$svn_dir" 3.25.6
          [ "$(cat "$svn_dir/.polarion-docker-version")" = "2506" ] || { echo "FAIL: marker not 2506"; exit 1; }
          if grep -q "last used by" "$svn_dir.out"; then cat "$svn_dir.out"; echo "FAIL: note on a fresh volume"; exit 1; fi
          echo "OK: fresh volume -> marker 2506, no note"
          boot "$svn_dir" 3.25.6
          if grep -q "last used by" "$svn_dir.out"; then cat "$svn_dir.out"; echo "FAIL: note on the same version"; exit 1; fi
          echo "OK: same version again -> no note"
          boot "$svn_dir" 3.26.6
          grep -q "NOTE: this SVN volume was last used by Polarion 2506, this container runs Polarion 2606" "$svn_dir.out" || { cat "$svn_dir.out"; echo "FAIL: no note for 2506 -> 2606"; exit 1; }
          [ "$(cat "$svn_dir/.polarion-docker-version")" = "2606" ] || { echo "FAIL: marker not updated to 2606"; exit 1; }
          echo "OK: other version -> note, marker updated"
          boot "$svn_dir" 3.24.10
          grep -q "last used by Polarion 2606, this container runs Polarion 2410" "$svn_dir.out" || { cat "$svn_dir.out"; echo "FAIL: 2-digit month (10) parsed wrong"; exit 1; }
          boot "$svn_dir" 3.25.08
          [ "$(cat "$svn_dir/.polarion-docker-version")" = "2508" ] || { echo "FAIL: leading-zero month treated as octal"; exit 1; }
          echo "OK: months 10 and 08 parsed"
          plugins_empty="$(mktemp -d)"
          other_dir="$(mktemp -d)/svn"
          SVN_DATA_DIR="$other_dir" SVN_BOOTSTRAP_DIR=/nonexistent POLARION_PLUGINS_DIR="$plugins_empty" \
              bash -c 'source "$0"' "$PWD/entrypoint.d/04-bootstrap-svn.sh" > "$other_dir.out" 2>&1
          [ ! -e "$other_dir/.polarion-docker-version" ] || { echo "FAIL: marker written without a detectable version"; exit 1; }
          echo "OK: no platform plugin -> no marker, no failure"

          echo "-- SVN credentials: Polarion-owned passwd on file-auth versions --"
          conf_dir="$(mktemp -d)"
          # Shaped like the images' polarionSVN.conf: file auth (2410/2506) vs DB auth (2512+).
          printf '%s\n' '<Location /repo>' 'DAV svn' 'AuthUserFile "/srv/polarion/svn/passwd"' \
              '	AuthBasicProvider file ldap' '</Location>' '<Location /installrepo>' 'AuthUserFile x' '</Location>' > "$conf_dir/file.conf"
          printf '%s\n' '<Location /repo>' 'DAV svn' '    AuthBasicProvider dbd' '    AuthDBDUserPWQuery "SELECT 1"' '</Location>' \
              '<Location /installrepo>' 'AuthUserFile "/srv/polarion/svn/passwd"' '</Location>' > "$conf_dir/dbd.conf"
          cred_boot() { # cred_boot <svn dir> <apache conf>
              SVN_DATA_DIR="$1" SVN_BOOTSTRAP_DIR=/nonexistent POLARION_PLUGINS_DIR=/nonexistent POLARION_APACHE_SVN_CONF="$2" \
                  bash -c 'source "$0"' "$PWD/entrypoint.d/04-bootstrap-svn.sh" >/dev/null 2>&1
          }
          for variant in file dbd missing; do
              d="$(mktemp -d)/svn"; mkdir -p "$d"; printf 'polarion:$apr1$systemsecret\n' > "$d/passwd"
              cred_boot "$d" "$conf_dir/$variant.conf"
              [ "$(cat "$d/passwd")" = 'polarion:$apr1$systemsecret' ] || { cat "$d/passwd"; echo "FAIL: passwd edited ($variant)"; exit 1; }
          done
          echo "OK: 04 never edits Polarion's passwd (file auth, DB auth, no Polarion config)"

          command -v apache2ctl >/dev/null || DEBIAN_FRONTEND=noninteractive apt-get -qq install -y apache2 >/dev/null 2>&1
          repo_local_auth() { # repo_local_auth <conf variant>: /repo-local auth lines 05 generates
              # Only the generated config is checked; 05 also (re)starts Apache, which may fail on a rerun.
              service apache2 stop >/dev/null 2>&1 || true
              POLARION_APACHE_SVN_CONF="$conf_dir/$1.conf" bash -c 'source "$0"' "$PWD/entrypoint.d/05-configure-apache.sh" >/dev/null 2>&1 || true
              grep -E '^(AuthBasicProvider|AuthUserFile|AuthDBDUserPWQuery)' /etc/apache2/conf-available/polarionSVN-local.conf | tr '\n' '|'
          }
          expect_auth() {
              local got
              got="$(repo_local_auth "$1")"
              [ "$got" = "$2" ] || { cat /etc/apache2/conf-available/polarionSVN-local.conf; echo "FAIL: $1: expected '$2', got '$got'"; exit 1; }
              echo "OK: $1-auth /repo -> /repo-local: $got"
          }
          expect_auth file 'AuthBasicProvider file|AuthUserFile "/srv/polarion/svn/passwd_credentials"|'
          expect_auth dbd 'AuthBasicProvider dbd|AuthDBDUserPWQuery "SELECT password FROM polarion_internal.userauthn WHERE username = %s"|'
          expect_auth missing 'AuthBasicProvider file|AuthUserFile "/srv/polarion/svn/passwd"|'
          apache2ctl -t >/dev/null 2>&1 || { apache2ctl -t; echo "FAIL: generated Apache config invalid"; exit 1; }
          echo "OK: generated Apache config is valid"

          echo "✅ volume selection and SVN credential handling behave as expected"
          SCRIPT
          docker run --rm -v "$(pwd)/scripts:/repo/scripts:ro" -v "$(pwd)/entrypoint.d:/repo/entrypoint.d:ro" \
            -v /tmp/volume-test.sh:/volume-test.sh:ro -w /repo ubuntu:24.04 bash /volume-test.sh
