name: PR Checks

on:
  pull_request:
    branches: [main, master, v*]

permissions:
  contents: read

jobs:
  static-checks:
    name: Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lint Dockerfile (hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error
          ignore: DL3008,DL3009,DL3015

      - name: Lint Shell Scripts (shellcheck)
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: "."
          severity: error
          additional_files: "polarion_starter.sh"
        env:
          SHELLCHECK_OPTS: --shell=bash --exclude=SC1091,SC2039

      - name: Lint YAML files (yamllint)
        run: |
          pip install --quiet yamllint
          yamllint -d "{extends: relaxed, rules: {line-length: {max: 200}}}" \
            .github/workflows/ \
            docker-compose.yml \
            docker-compose.dev.yml

      - name: Check Python syntax
        run: |
          python3 -m py_compile scripts/download_polarion_zip.py
          echo "✅ Python syntax OK"

      - name: Validate docker-compose files
        run: |
          docker compose -f docker-compose.yml config --quiet
          echo "✅ docker-compose.yml valid"
          docker compose -f docker-compose.dev.yml config --quiet
          echo "✅ docker-compose.dev.yml valid"

  timezone-tests:
    name: Timezone Auto-Detection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build isolated timezone test image
        run: |
          # Standalone image (not the full Polarion Dockerfile, no licensed ZIP needed) that
          # replicates just the tzdata/JVM layer entrypoint.d/00-configure-timezone.sh and
          # entrypoint.d/01-configure-postgres.sh depend on, so this job stays fast and runs
          # on every PR from anyone. It COPYs the real scripts from this checkout, so it always
          # tests what would actually ship, not a duplicated copy of the logic. Built from a
          # dedicated context dir, not the checkout root, so nothing needs cleaning up after.
          mkdir -p /tmp/tz-test-ctx
          cp entrypoint.d/00-configure-timezone.sh entrypoint.d/01-configure-postgres.sh /tmp/tz-test-ctx/

          # Fixed-offset, DST-free zones (Etc/GMT-N) so assertions never depend on the date
          # this job happens to run on. Also probes the JVM (jshell), not just glibc's `date`
          # — the two resolve timezone via different mechanisms (env var vs. symlink-target
          # name vs. byte-content matching) and have silently disagreed with each other in
          # every prior version of this feature; a check that only looks at `date` would have
          # missed every one of those bugs. Each value is captured twice — once inherited
          # normally, once under "env -i" — because Apache/PostgreSQL/Polarion in the real
          # image start via "service", which drops TZ from the environment entirely; a fix
          # that only works when TZ is inherited directly is not actually fixed.
          cat > /tmp/tz-test-ctx/tz-test-runner.sh <<'EOF'
          #!/bin/bash
          . /opt/tz/00-configure-timezone.sh
          echo "TZFILE=$(cat /etc/timezone 2>/dev/null || echo MISSING)"
          echo "OFFSET=$(date +%z)"
          echo "JVM_ZONE=$(echo 'System.out.println(java.util.TimeZone.getDefault().getID());' | jshell -q - 2>&1 | tail -1)"
          echo "ENVI_OFFSET=$(env -i PATH="$PATH" date +%z)"
          echo "ENVI_JVM_ZONE=$(env -i PATH="$PATH" bash -c "echo 'System.out.println(java.util.TimeZone.getDefault().getID());' | jshell -q -" 2>&1 | tail -1)"
          EOF

          cat > /tmp/tz-test-ctx/Dockerfile <<'EOF'
          FROM eclipse-temurin:21-jdk
          ENV DEBIAN_FRONTEND=noninteractive
          RUN apt-get -y update && \
            apt-get -y install --no-install-recommends tzdata postgresql && \
            apt-get clean && rm -rf /var/lib/apt/lists/* && \
            cp --remove-destination /usr/share/zoneinfo/Etc/UTC /etc/localtime && \
            rm -f /etc/timezone
          COPY 00-configure-timezone.sh /opt/tz/00-configure-timezone.sh
          COPY 01-configure-postgres.sh /opt/tz/01-configure-postgres.sh
          COPY tz-test-runner.sh /tz-test-runner.sh
          RUN sed -i 's/\r//' /opt/tz/*.sh /tz-test-runner.sh && chmod +x /tz-test-runner.sh
          EOF

          docker build -q -t tz-test:ci /tmp/tz-test-ctx
          echo "✅ Timezone test image built"

      - name: Prepare shared assertions
        run: |
          # Shared by the two TZ verification steps below (sourced, not duplicated) so the assertion logic
          # only needs fixing/extending in one place. Checks TZFILE, OFFSET and JVM_ZONE, each
          # both direct and under "env -i" — asserting only OFFSET previously let a broken
          # reverse-lookup fix (JVM falling back to bare "GMT" while glibc showed the correct
          # host time) pass every scenario silently; this suite is only worth having if it
          # actually re-fails that exact class of bug.
          cat > /tmp/assert-tz-scenario.sh <<'EOF'
          assert_tz_scenario() {
              local label="$1" expected_tzfile="$2" expected_offset="$3" expected_jvm="$4" output="$5"
              local field expected actual
              for field in TZFILE OFFSET JVM_ZONE ENVI_OFFSET ENVI_JVM_ZONE; do
                  case "$field" in
                      TZFILE) expected="$expected_tzfile" ;;
                      OFFSET|ENVI_OFFSET) expected="$expected_offset" ;;
                      JVM_ZONE|ENVI_JVM_ZONE) expected="$expected_jvm" ;;
                  esac
                  actual="$(printf '%s\n' "$output" | grep "^${field}=" | cut -d= -f2-)"
                  if [ "$actual" != "$expected" ]; then
                      echo "FAIL: $label: $field expected '$expected', got '$actual'"
                      printf '%s\n' "$output"
                      exit 1
                  fi
              done
              echo "OK: $label: TZFILE=$expected_tzfile OFFSET=$expected_offset JVM=$expected_jvm — glibc and the JVM agree, both direct and under env -i"
          }
          EOF
          echo "✅ Shared assertion helper written"

      - name: Verify auto-detect and explicit override
        run: |
          . /tmp/assert-tz-scenario.sh

          echo "🔍 No mount, no TZ -> image default Etc/UTC"
          out=$(docker run --rm tz-test:ci /tz-test-runner.sh)
          assert_tz_scenario "no mount / no TZ" "Etc/UTC" "+0000" "UTC" "$out"

          echo "🔍 Host timezone mounted (Etc/GMT-5), no TZ -> auto-detected"
          out=$(docker run --rm -v /usr/share/zoneinfo/Etc/GMT-5:/etc/host-localtime:ro tz-test:ci /tz-test-runner.sh)
          assert_tz_scenario "auto-detect" "Etc/GMT-5" "+0500" "Etc/GMT-5" "$out"

          echo "🔍 Host mounted (Etc/GMT-5) + explicit TZ=Etc/GMT-8 -> override wins"
          out=$(docker run --rm -v /usr/share/zoneinfo/Etc/GMT-5:/etc/host-localtime:ro -e TZ=Etc/GMT-8 tz-test:ci /tz-test-runner.sh)
          assert_tz_scenario "explicit override" "Etc/GMT-8" "+0800" "Etc/GMT-8" "$out"

      - name: Verify malformed/hostile TZ input can't crash or leak through
        run: |
          . /tmp/assert-tz-scenario.sh

          echo "🔍 Unknown TZ name -> warns, falls back to detected zone, doesn't leak into children"
          out=$(docker run --rm -v /usr/share/zoneinfo/Etc/GMT-5:/etc/host-localtime:ro -e TZ=Bogus/Zone tz-test:ci /tz-test-runner.sh 2>&1)
          echo "$out" | grep -q "WARNING: TZ='Bogus/Zone' is not a valid timezone" || { echo "FAIL: expected warning not printed"; echo "$out"; exit 1; }
          assert_tz_scenario "unknown TZ" "Etc/GMT-5" "+0500" "Etc/GMT-5" "$out"

          echo "🔍 TZ pointing at non-zone zoneinfo metadata (zone.tab) -> rejected, not silently accepted"
          out=$(docker run --rm -e TZ=zone.tab tz-test:ci /tz-test-runner.sh)
          assert_tz_scenario "non-zone TZ" "Etc/UTC" "+0000" "UTC" "$out"

          echo "🔍 Path-traversal-shaped TZ -> rejected"
          out=$(docker run --rm -e "TZ=../../etc/hostname" tz-test:ci /tz-test-runner.sh)
          assert_tz_scenario "path traversal TZ" "Etc/UTC" "+0000" "UTC" "$out"

          echo "🔍 Host timezone data with no byte-identical match anywhere in this image's tzdata -> uniform Etc/UTC fallback, not a glibc/JVM split"
          head -c 200 /dev/urandom > /tmp/random-localtime
          out=$(docker run --rm -v /tmp/random-localtime:/etc/host-localtime:ro tz-test:ci /tz-test-runner.sh 2>&1)
          echo "$out" | grep -q "WARNING: the host's timezone data has no byte-identical match" || { echo "FAIL: expected warning not printed"; echo "$out"; exit 1; }
          assert_tz_scenario "unmatched host tzdata" "Etc/UTC" "+0000" "UTC" "$out"

          echo "🔍 Bind-mounted straight onto /etc/localtime (wrong target) -> warns instead of silently claiming success"
          out=$(docker run --rm -v /usr/share/zoneinfo/Etc/GMT-5:/etc/localtime:ro tz-test:ci /tz-test-runner.sh 2>&1)
          echo "$out" | grep -q "WARNING: /etc/localtime is not writable" || { echo "FAIL: expected warning not printed"; echo "$out"; exit 1; }
          # /etc/timezone stays unwritten (apply_zone must not report success), while
          # /etc/localtime itself keeps showing what the host actually mounted there.
          assert_tz_scenario "wrong mount target" "MISSING" "+0500" "Etc/GMT-5" "$out"

      - name: Verify polarion_detect_host_timezone's fallback chain
        run: |
          # scripts/polarion-runtime-lib.sh runs on the HOST (not in the container being
          # started), so it can't rely on a bind mount — it reads the host's timezone
          # directly instead, and this is the only detection path scripts/polarionctl.sh
          # actually uses (it forwards the result as -e TZ=..., never bind-mounts
          # /etc/host-localtime). Exercised in a disposable container per scenario so each
          # can freely manipulate /etc/localtime, /etc/timezone, and stub out "timedatectl"
          # without touching this job's own runner.
          assert_detected_tz() {
              local label="$1" expected="$2" actual="$3"
              if [ "$actual" != "$expected" ]; then
                  echo "FAIL: $label: expected POLARION_TZ='$expected', got '$actual'"
                  exit 1
              fi
              echo "OK: $label -> POLARION_TZ='$expected'"
          }
          run_detect() {
              docker run --rm -v "$(pwd)/scripts/polarion-runtime-lib.sh:/opt/lib/polarion-runtime-lib.sh:ro" \
                ubuntu:24.04 bash -c "$1"
          }

          echo "🔍 /etc/localtime is a symlink into zoneinfo/ -> detected from its target"
          result=$(run_detect '
            apt-get -y update >/dev/null 2>&1 && DEBIAN_FRONTEND=noninteractive apt-get -y install --no-install-recommends tzdata >/dev/null 2>&1
            ln -snf /usr/share/zoneinfo/Europe/Berlin /etc/localtime
            source /opt/lib/polarion-runtime-lib.sh
            echo "$POLARION_TZ"
          ')
          assert_detected_tz "symlink" "Europe/Berlin" "$result"

          echo "🔍 /etc/localtime is not a symlink, but timedatectl reports a zone -> detected from timedatectl"
          result=$(run_detect '
            rm -f /etc/localtime
            printf "#!/bin/bash\necho Asia/Tokyo\n" > /usr/local/bin/timedatectl
            chmod +x /usr/local/bin/timedatectl
            source /opt/lib/polarion-runtime-lib.sh
            echo "$POLARION_TZ"
          ')
          assert_detected_tz "timedatectl fallback" "Asia/Tokyo" "$result"

          echo "🔍 Neither a symlink nor timedatectl, but /etc/timezone has content -> detected from that file"
          result=$(run_detect '
            rm -f /etc/localtime
            echo "America/Sao_Paulo" > /etc/timezone
            source /opt/lib/polarion-runtime-lib.sh
            echo "$POLARION_TZ"
          ')
          assert_detected_tz "/etc/timezone fallback" "America/Sao_Paulo" "$result"

          echo "🔍 None of the three available -> empty (caller falls back to the image default, NOTE printed)"
          result=$(run_detect '
            rm -f /etc/localtime /etc/timezone
            source /opt/lib/polarion-runtime-lib.sh
            echo "[$POLARION_TZ]"
          ' 2>&1)
          echo "$result" | grep -q "NOTE: could not detect this host's timezone" && { echo "FAIL: the NOTE must only print inside polarionctl.sh's start) case, not from the library itself"; exit 1; }
          assert_detected_tz "nothing detectable" "[]" "$(echo "$result" | tail -1)"

          echo "🔍 POLARION_TZ already set -> detection skipped, explicit value wins"
          result=$(run_detect '
            apt-get -y update >/dev/null 2>&1 && DEBIAN_FRONTEND=noninteractive apt-get -y install --no-install-recommends tzdata >/dev/null 2>&1
            ln -snf /usr/share/zoneinfo/Europe/Berlin /etc/localtime
            export POLARION_TZ=Custom/Zone
            source /opt/lib/polarion-runtime-lib.sh
            echo "$POLARION_TZ"
          ')
          assert_detected_tz "explicit POLARION_TZ wins" "Custom/Zone" "$result"

      - name: Verify PostgreSQL timezone config stays in sync, including on revert
        run: |
          # Written to a file and mounted in rather than passed via "docker run ... bash -c"
          # so the script's own single/double quoting (postgresql.conf's "timezone = 'X'"
          # syntax) never has to fight the outer shell's quoting.
          cat > /tmp/pg-tz-test.sh <<'EOF'
          #!/bin/bash
          set -e
          if ! su postgres -c "/usr/lib/postgresql/*/bin/initdb -D /tmp/pgdata" >/tmp/initdb.log 2>&1; then
              echo "FAIL: initdb failed:"
              cat /tmp/initdb.log
              exit 1
          fi
          mkdir -p /opt/polarion/data
          ln -s /tmp/pgdata /opt/polarion/data/postgres-data
          PG_CONF=/tmp/pgdata/postgresql.conf

          apply_pg_tz() {
              echo "$1" > /etc/timezone
              . /opt/tz/01-configure-postgres.sh >/dev/null 2>&1 || true
          }

          # A -> B -> B -> C -> B -> B: the repeat and the revert-to-a-prior-zone are both
          # deliberate. An earlier version of this fix used an unanchored substring match to
          # decide whether a rewrite was needed, which also matched its own commented-out
          # line — so reverting to zone B after C silently kept Postgres on C.
          for z in Etc/UTC Etc/GMT-5 Etc/GMT-5 Etc/GMT-8 Etc/GMT-5 Etc/GMT-5; do
              apply_pg_tz "$z"
              active="$(grep -E "^timezone = '${z}'" "$PG_CONF" || true)"
              if [ -z "$active" ]; then
                  echo "FAIL: after setting $z, postgresql.conf timezone is not active:"
                  grep -E "^timezone|^#timezone" "$PG_CONF"
                  exit 1
              fi
              tz_count=$(grep -cE "^timezone = " "$PG_CONF")
              logtz_count=$(grep -cE "^log_timezone = " "$PG_CONF")
              if [ "$tz_count" != "1" ] || [ "$logtz_count" != "1" ]; then
                  echo "FAIL: after setting $z, expected exactly 1 active timezone/log_timezone line, got $tz_count/$logtz_count (config growing unbounded on restart)"
                  exit 1
              fi
          done
          echo "OK: PostgreSQL timezone/log_timezone track every change, including reverting to a prior zone, without growing unbounded"

          # initdb ships this commented out, so the earlier version of this check (asserting
          # it's still commented) could never fail regardless of correctness. Uncomment it
          # first, then apply a zone the loop above didn't just leave active (Etc/GMT-3,
          # never used yet) so the idempotency guard can't skip the rewrite and hide a
          # regression — to prove the timezone sed pattern, anchored on "=" since round 4,
          # leaves an unrelated, already-active setting alone instead of also matching and
          # re-commenting it.
          sed -i "s/^#timezone_abbreviations/timezone_abbreviations/" "$PG_CONF"
          apply_pg_tz "Etc/GMT-3"
          if ! grep -q "^timezone_abbreviations" "$PG_CONF"; then
              echo "FAIL: timezone_abbreviations was commented out — the timezone sed pattern is matching more than intended"
              exit 1
          fi
          echo "OK: timezone_abbreviations left untouched by the timezone sed pattern"
          EOF

          docker run --rm -v /tmp/pg-tz-test.sh:/pg-tz-test.sh:ro tz-test:ci bash /pg-tz-test.sh

      - name: Verify listen_addresses config stays in sync, without growing unbounded
        run: |
          # Same script as the timezone step above (01-configure-postgres.sh configures both
          # listen_addresses and timezone/log_timezone in one pass), same tz-test:ci image,
          # same real initdb-created postgresql.conf — just asserting the OTHER guard in that
          # file. Regression test for #83: the original code unconditionally commented out the
          # previous listen_addresses line and appended a fresh one on every container start,
          # so postgresql.conf grew by two lines per restart forever.
          cat > /tmp/pg-listen-test.sh <<'EOF'
          #!/bin/bash
          set -e
          if ! su postgres -c "/usr/lib/postgresql/*/bin/initdb -D /tmp/pgdata" >/tmp/initdb.log 2>&1; then
              echo "FAIL: initdb failed:"
              cat /tmp/initdb.log
              exit 1
          fi
          mkdir -p /opt/polarion/data
          ln -s /tmp/pgdata /opt/polarion/data/postgres-data
          PG_CONF=/tmp/pgdata/postgresql.conf

          # NOTE: a live-line-count assertion alone is not enough here — the ORIGINAL bug
          # comments out the previously-appended active line before appending a new one, so
          # exactly 1 active line is true on every single run even though the file grows by
          # one commented-out line every time. The real regression signal is the TOTAL count
          # (live + commented-out) and the file's line count staying flat from the second run
          # onward, once the guard has had one run to settle.
          . /opt/tz/01-configure-postgres.sh >/dev/null 2>&1 || true
          live_count=$(grep -cxF "listen_addresses = '*'" "$PG_CONF" || true)
          if [ "$live_count" != "1" ]; then
              echo "FAIL: after the first start, expected exactly 1 active listen_addresses line, got $live_count"
              grep -E "^listen_addresses|^#listen_addresses" "$PG_CONF" || true
              exit 1
          fi
          base_total=$(grep -c "listen_addresses" "$PG_CONF" || true)
          base_lines=$(wc -l < "$PG_CONF")

          for i in 2 3 4 5; do
              . /opt/tz/01-configure-postgres.sh >/dev/null 2>&1 || true
              live_count=$(grep -cxF "listen_addresses = '*'" "$PG_CONF" || true)
              total_count=$(grep -c "listen_addresses" "$PG_CONF" || true)
              total_lines=$(wc -l < "$PG_CONF")
              if [ "$live_count" != "1" ] || [ "$total_count" != "$base_total" ] || [ "$total_lines" != "$base_lines" ]; then
                  echo "FAIL: after start #$i, expected 1 active line and $base_total total listen_addresses line(s) in a $base_lines-line file, got $live_count active / $total_count total in a $total_lines-line file (config growing unbounded on restart)"
                  grep -nE "listen_addresses" "$PG_CONF" || true
                  exit 1
              fi
          done
          echo "OK: listen_addresses stays at exactly 1 active line across 5 restarts, and the total listen_addresses line count ($base_total) and file size ($base_lines lines) never grow after the first start"
          EOF

          docker run --rm -v /tmp/pg-listen-test.sh:/pg-listen-test.sh:ro tz-test:ci bash /pg-listen-test.sh

  shutdown-tests:
    name: Graceful Shutdown & Startup Reporting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build isolated shutdown test image
        run: |
          # No licensed Polarion ZIP needed: `service` and `pg_ctl` are stubbed as fake
          # executables that log their own invocation to a file, so this exercises the REAL
          # polarion_starter.sh (COPYed from this checkout) against a fake environment instead
          # of duplicating its logic. Regression coverage for #80 (SIGTERM/INT now stop
          # Polarion/Apache/PostgreSQL in order instead of the container being SIGKILLed once
          # Docker's stop grace period runs out) and #87 (a failed entrypoint.d script is
          # reported in the final startup message instead of being silently swallowed).
          mkdir -p /tmp/shutdown-test-ctx/entrypoint.d
          cp polarion_starter.sh /tmp/shutdown-test-ctx/

          cat > /tmp/shutdown-test-ctx/entrypoint.d/01-fail.sh <<'EOF'
          #!/bin/bash
          echo "simulating a failed entrypoint step"
          return 1
          EOF

          cat > /tmp/shutdown-test-ctx/service <<'EOF'
          #!/bin/bash
          echo "STUB service $*" >> /tmp/shutdown-log
          exit 0
          EOF

          cat > /tmp/shutdown-test-ctx/pg_ctl <<'EOF'
          #!/bin/bash
          echo "STUB pg_ctl $*" >> /tmp/shutdown-log
          exit 0
          EOF

          cat > /tmp/shutdown-test-ctx/Dockerfile <<'EOF'
          FROM ubuntu:24.04
          # Only "sudo" plus a bare "postgres" system account are needed here — the real
          # PostgreSQL package isn't, since pg_ctl itself is stubbed out below.
          RUN apt-get -y update && \
            apt-get -y install --no-install-recommends sudo && \
            apt-get clean && rm -rf /var/lib/apt/lists/* && \
            useradd --system --no-create-home postgres
          RUN mkdir -p /opt/polarion/entrypoint.d /opt/polarion/data/postgres-data /usr/lib/postgresql/current/bin
          COPY entrypoint.d/01-fail.sh /opt/polarion/entrypoint.d/01-fail.sh
          COPY polarion_starter.sh /polarion_root/polarion_starter.sh
          COPY service /usr/local/bin/service
          COPY pg_ctl /usr/lib/postgresql/current/bin/pg_ctl
          RUN chmod +x /opt/polarion/entrypoint.d/01-fail.sh /polarion_root/polarion_starter.sh \
            /usr/local/bin/service /usr/lib/postgresql/current/bin/pg_ctl
          # Pre-created world-writable, at build time: whichever stub writes to it FIRST at
          # runtime (root via the "service" stub, or the "postgres" user via "sudo -u postgres"
          # in the pg_ctl stub) must not end up implicitly owning it at a mode the other can't
          # append to.
          RUN touch /tmp/shutdown-log && chmod 666 /tmp/shutdown-log
          WORKDIR /polarion_root
          EOF

          docker build -q -t shutdown-test:ci /tmp/shutdown-test-ctx
          echo "✅ Shutdown test image built"

      - name: Verify SIGTERM stops services in order and the startup message reflects failures
        run: |
          # Log file lives inside the container's own filesystem, retrieved via "docker cp"
          # after stop instead of a host bind-mount: a bind-mounted log hit permission-denied
          # writes from inside the container on hosted runners even after chmod 666 on the host
          # side, which a plain in-container file + "docker cp" sidesteps entirely.
          docker rm -f shutdown-test >/dev/null 2>&1 || true
          docker run -d --name shutdown-test shutdown-test:ci ./polarion_starter.sh >/dev/null
          sleep 3

          start_ts=$(date +%s)
          docker stop -t 30 shutdown-test >/dev/null
          end_ts=$(date +%s)
          elapsed=$((end_ts - start_ts))

          out="$(docker logs shutdown-test 2>&1)"
          docker cp shutdown-test:/tmp/shutdown-log /tmp/shutdown-log 2>/dev/null || : > /tmp/shutdown-log
          docker rm shutdown-test >/dev/null

          echo "--- container output ---"
          echo "$out"
          echo "--- shutdown-log ---"
          cat /tmp/shutdown-log

          if [ "$elapsed" -ge 25 ]; then
            echo "FAIL: docker stop took ${elapsed}s (30s timeout) — the SIGTERM trap did not fire promptly, the container was likely SIGKILLed after the grace period instead of shutting down cleanly"
            exit 1
          fi
          echo "OK: docker stop returned in ${elapsed}s, well inside the 30s grace period — no SIGKILL fallback needed"

          grep -q "STUB service polarion stop" /tmp/shutdown-log || { echo "FAIL: 'service polarion stop' was not called"; exit 1; }
          grep -q "STUB service apache2 stop" /tmp/shutdown-log || { echo "FAIL: 'service apache2 stop' was not called"; exit 1; }
          grep -q "STUB pg_ctl.*-m fast stop" /tmp/shutdown-log || { echo "FAIL: 'pg_ctl -m fast stop' was not called"; exit 1; }

          # Presence alone doesn't prove ORDER — assert the actual sequence in the log.
          actual_order="$(grep -E 'STUB (service|pg_ctl)' /tmp/shutdown-log | sed -E 's/^STUB (service polarion|service apache2|pg_ctl) .*/\1/')"
          expected_order="$(printf 'service polarion\nservice apache2\npg_ctl')"
          if [ "$actual_order" != "$expected_order" ]; then
            echo "FAIL: services were not stopped in the expected order (polarion, then apache2, then postgres). Got:"
            echo "$actual_order"
            exit 1
          fi
          echo "OK: polarion, apache2 and postgres were stopped in that exact order on SIGTERM"

          echo "$out" | grep -q "!!! FAILED (1): /opt/polarion/entrypoint.d/01-fail.sh" || { echo "FAIL: the simulated entrypoint failure was not reported"; exit 1; }
          echo "$out" | grep -q "step(s) failed" || { echo "FAIL: the final startup message doesn't reflect the failed step"; exit 1; }
          echo "OK: a failed entrypoint.d script is reported in the startup log instead of being silently ignored"
