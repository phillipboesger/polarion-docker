version: '3.8'

services:
  polarion:
    # Local development defaults to the locally built image.
    # Override with POLARION_IMAGE=ghcr.io/phillipboesger/polarion-docker:latest when needed.
    image: ${POLARION_IMAGE:-polarion:local}
    platform: linux/amd64  # Important for Apple Silicon Macs
    container_name: polarion
    mem_limit: 4g
    ports:
      # Only HTTP is published on all interfaces — the container is meant to be
      # reachable from other machines/VMs. The rest are loopback-only: JDWP has no
      # authentication at all, and PostgreSQL accepts the polarion:polarion
      # credentials documented in this repo. To reach one of them from another
      # host, override the mapping in a local compose override file.
      - "80:80"                   # HTTP port
      - "127.0.0.1:5433:5433"     # PostgreSQL port
      - "127.0.0.1:5005:5005"     # JDWP Debug port
      - "127.0.0.1:8025:8025"     # built-in Mailpit web UI -> http://localhost:8025
    environment:
      # These can be customized when creating the container
      - POLARION_HOME=/polarion_root
      - JAVA_OPTS=-Xmx3g -Xms3g
      - ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0
      - JDWP_ENABLED=true
      # Container clock timezone. The bind mount below auto-detects it from the host, so TZ
      # is normally left unset here (bare "TZ" passes the host shell's value through only if
      # exported there — "TZ=${TZ:-}" would set it to an empty string, which glibc/the JVM
      # both treat as UTC). Export TZ=Region/City before "docker compose up" to force a
      # different zone than the host's.
      - TZ
      # The built-in Mailpit catcher runs by default and captures Polarion's outgoing
      # notification mail (open http://localhost:8025). To route mail to a real server
      # instead, set SMTP_HOST/SMTP_PORT here; to disable the catcher, set MAILPIT_EMBEDDED=false.
    volumes:
      # Matches the container clock to the host's real timezone with no configuration needed.
      # Mounted to /etc/host-localtime, not /etc/localtime directly: entrypoint.d/00-configure
      # -timezone.sh copies it into the container's own /etc/localtime at startup, which also
      # keeps that file rewritable there for an explicit TZ override (see that script).
      - /etc/localtime:/etc/host-localtime:ro
    healthcheck:
      test:
        - CMD
        - wget
        - -o
        - /dev/null
        - -O
        - /dev/null
        - http://localhost/polarion/
      interval: 5s
      timeout: 2s
      retries: 10
      start_period: 10s
    restart: unless-stopped
