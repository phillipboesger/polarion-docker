# Per-request base URL (see config/baseurl.lua and entrypoint.d/05-configure-apache.sh).
<IfModule lua_module>
LuaOutputFilter polarion_baseurl /etc/apache2/lua/baseurl.lua baseurl_filter
<Location /polarion>
SetOutputFilter polarion_baseurl
<IfModule headers_module>
Header append Vary Host
</IfModule>
</Location>
</IfModule>
