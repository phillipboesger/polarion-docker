# Per-request base URL (see config/baseurl.lua and entrypoint.d/05-configure-apache.sh).
# Installed as zz-polarion-baseurl.conf on purpose: polarion.conf has a regex <Location> with
# "SetOutputFilter DEFLATE" for /polarion, and the later-merged setting wins. This regex <Location>
# loads after it and chains our filter in front of DEFLATE.
<IfModule lua_module>
LuaOutputFilter polarion_baseurl /etc/apache2/lua/baseurl.lua baseurl_filter
<Location ~ "^/polarion(?!(/bir|/template-download|/svnwebclient))">
SetOutputFilter polarion_baseurl;DEFLATE
<IfModule headers_module>
# Polarion/Tomcat gzips REST JSON when the client accepts it; the filter cannot rewrite an encoded body.
RequestHeader unset Accept-Encoding
Header append Vary Host
</IfModule>
</Location>
</IfModule>
